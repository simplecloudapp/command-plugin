name: Create Release with ShadowJars

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ShadowJars and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ShadowJars
        run: ./gradlew clean build shadowJar

      - name: Get Gradle Version
        id: gradle_version
        run: echo "GRADLE_VERSION=$(./gradlew properties -q | grep "version:" | awk '{print $2}')" >> $GITHUB_ENV

      - name: Publish to Modrinth
        run: ./gradlew modrinth && ./gradlew modrinthSyncBody
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Create Release
        run: |
          jars=()
          for jar in $(find . -type f -name "*.jar" -path "*/build/libs/*.jar" -not -path "./build/libs/*"); do
            if [[ $(basename "$jar") =~ -[0-9]+\.[0-9]+ ]]; then
              echo "Skipping $jar due to version number"
            else
              echo "Uploading $jar"
              jars+=("$jar")
            fi
          done

          if [ ${#jars[@]} -eq 0 ]; then
            echo "No matching JARs found to upload."
            exit 1
          fi

          gh release create "v${GRADLE_VERSION}" \
            --target "${{ github.sha }}" \
            --title "v${GRADLE_VERSION}" \
            --notes "This release contains release builds for all Gradle modules." \
            "${jars[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}